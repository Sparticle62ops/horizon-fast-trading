[package]
name = "horizon-mod-fast-trading"
version = "1.0.1"
edition = "2024"
license = "MIT"
publish = false
description = "Repeat the selected villager trade fast on Horizon: a Rust port of FastTrading."

# The mod logic's pure core and its tests. The game-touching half
# (`mixins/fast_trading/runtime.rs` and its helpers) is injected into the
# client by the bundle's horizon-mixin.toml and compiled there.
[lib]
path = "src/lib.rs"

